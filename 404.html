<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGIC CREATIONS | Invitation</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6f1;color:#55443d;font:15px Arial,sans-serif}
main{max-width:560px;margin:24px;padding:36px 28px;text-align:center;background:#fffdf9;border:1px solid #e8ddd3;border-radius:14px}
h1{font:34px Georgia,serif;font-weight:400}p{line-height:1.7;color:#7c7069}a{color:#875f55}
</style>
</head>
<body>
<main><h1>Invitation link</h1><p id="message">Opening your invitation…</p><a href="./index.html">MAGIC CREATIONS</a></main>
<script>
(function(){
 var match=location.pathname.match(/(?:^|\/)i\/([^/]+)\/?$/i);
 if(match){
  var slug=decodeURIComponent(match[1]);
  var base=location.pathname.slice(0,location.pathname.lastIndexOf('/i/'))+'/';
  var target=base+'event-workspace.html?public='+encodeURIComponent(slug);
  location.replace(target);
  return;
 }
 document.getElementById('message').textContent='This page could not be found. Please check the invitation link.';
})();
</script>
</body>
</html>
