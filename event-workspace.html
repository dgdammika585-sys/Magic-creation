.overview-empty{min-height:195px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 12px;border:1px dashed #e7dcd3;border-radius:10px;background:#fdfaf7}

.overview-empty p{max-width:320px;font-size:10px;line-height:1.7;color:#8e8178;margin:7px 0 12px}

.overview-rsvp-row>span{font-size:10px;color:#776a62}.overview-rsvp-row>strong{text-align:right;font-size:11px;color:#564941;font-variant-numeric:tabular-nums}

.overview-rsvp-track .confirmed{background:#78a58a}.overview-rsvp-track .pending{background:#d8b17b}.overview-rsvp-track .declined{background:#c78982}.overview-rsvp-track .maybe{background:#9b91b6}

.overview-recent-table{width:100%}.overview-recent-table td,.overview-recent-table th{padding:11px 8px}.overview-recent-table th{font-size:8px;letter-spacing:.08em;color:#95877e;text-align:left}.overview-recent-table td{font-size:10px}

function overview(){
 var e=current(),expected=Math.max(0,Number(e.totalAttendees||0)),guests=Array.isArray(e.guests)?e.guests:[],invitedSeats=totalInvited(e);

function sectionPhotosView(){var e=current();e.sectionPhotos=e.sectionPhotos||{};e.ownSections=Array.isArray(e.ownSections)?e.ownSections:[];while(e.ownSections.length<3)e.ownSections.push({title:'',text:'',photo:null});var items=[{key:'countdown',title:'Countdown photo',desc:'Photo beside the days-to-go card.'},{key:'promise',title:'Our Promise artwork',desc:'Background artwork behind your promise card.'},{key:'schedule',title:'Your schedule photo',desc:'Photo shown with the Order of Events / schedule section.'},{key:'rsvp',title:'RSVP photo',desc:'Photo at the top of the reply card.'}];return head('SECTION PHOTOS','Photos that style your invitation','Choose an uploaded photo or add artwork for each section, including your own custom sections.')+'<div class="notice"><strong>Section photos</strong><p>Upload one image for each built-in section. For your own sections, add a heading, wording and photo. Photos are saved in this browser prototype.</p></div><div class="grid-2">'+items.map(function(it){var p=e.sectionPhotos[it.key];return '<section class="panel"><div class="panel-head"><div><h2>'+it.title+'</h2><p>'+it.desc+'</p></div></div>'+(p&&p.data?'<img src="'+p.data+'" alt="'+it.title+'" style="display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin:12px 0">':'<div class="empty" style="margin:12px 0"><strong>No photo uploaded</strong></div>')+'<p class="muted">'+(p&&p.name?esc(p.name):'0 photos uploaded')+'</p><div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn outline" for="sectionPhoto-'+it.key+'">'+(p&&p.data?'Change photo':'Upload photo')+'<input id="sectionPhoto-'+it.key+'" data-section-photo="'+it.key+'" type="file" accept="image/*" hidden></label>'+(p&&p.data?'<button class="btn danger" data-section-photo-remove="'+it.key+'">Remove</button>':'')+'</div></section>';}).join('')+'</div><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Your own sections</h2><p>The extra sections your templat function compressInvitationImage(file,maxDimension,maxChars,callback){
 var reader=new FileReader();
 reader.onerror=function(){callback(new Error('Could not read this image.'));};
 reader.onload=function(){
  var img=new Image();
  img.onerror=function(){callback(new Error('Could not process this image.'));};
  img.onload=function(){
   var scale=Math.min(1,maxDimension/Math.max(img.width,img.height)),qualities=[0.72,0.60,0.50,0.40,0.32],qualityIndex=0;
   function encode(){
    var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    var ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    var data=canvas.toDataURL('image/jpeg',qualities[qualityIndex]);
    if(data.length<=maxChars){callback(null,data);return;}
    if(qualityIndex<qualities.length-1){qualityIndex++;encode();return;}
    if(scale>0.34){scale*=0.78;qualityIndex=0;encode();return;}
    callback(new Error('This image is too large after compression. Please choose a smaller image.'));
   }
   encode();
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function uploadImage(ev){var files=Array.prototype.slice.call(ev.target.files||[]);if(!files.length)return;var e=current(),remaining=20-e.gallery.length;if(remaining<=0){toast('Gallery limit reached: 20 photos maximum.');ev.target.value='';return;}if(files.length>remaining){toast('You can add only '+remaining+' more photo(s).');files=files.slice(0,remaining);}var index=0,added=0;function next(){if(index>=files.length){ev.target.value='';if(added){var ok=save();if(ok){render();toast(added+' photo(s) added to your gallery.');}}return;}var file=files[index++];if(!file.type||file.type.indexOf('image/')!==0){toast('Please choose image files only.');next();return;}compressInvitationImage(file,320,9000,function(err,data){if(err){toast(file.name+': '+err.message);next();return;}e.gallery.push({id:uid(),name:file.name,data:data});added++;next();});}next();}
