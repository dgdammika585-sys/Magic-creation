/* Eventoura-inspired dashboard layout with original MAGIC CREATIONS styling */
.event-switcher{width:165px;max-width:22vw;padding:9px 10px;background:#faf5f0;border-color:#e5d9d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dashboard-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:16px;align-items:start}
.dashboard-stack{display:grid;gap:16px;min-width:0}
.panel-subtitle{font-size:9px;color:var(--muted);line-height:1.7;margin-top:5px}
.rsvp-list{display:grid;gap:15px}
.rsvp-item{display:grid;grid-template-columns:95px minmax(70px,1fr) 36px;align-items:center;gap:11px}
.rsvp-label{font-size:10px;color:#635951}
.rsvp-count{text-align:right;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.rsvp-track{height:8px;border-radius:20px;overflow:hidden;background:#f0e8e2}
.rsvp-track span{display:block;height:100%;border-radius:20px;transition:width .3s}
.rsvp-track .accepted{background:#839879}.rsvp-track .pending{background:#d7b27a}.rsvp-track .declined{background:#c98a82}.rsvp-track .maybe{background:#829ab1}
.rsvp-total{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:17px;padding-top:14px;color:var(--muted);font-size:9px}
.rsvp-total strong{color:var(--ink);font-size:10px}
.link-box{border:1px solid #e8d9d0;background:linear-gradient(130deg,#fbf5ef,#fffdfa);padding:17px;border-radius:7px}
.link-box-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.link-box h3{font:21px var(--serif);font-weight:400;margin:0}
.link-box p{font-size:10px;line-height:1.8;color:var(--muted);margin:8px 0 13px}
.link-field{display:flex;gap:7px;align-items:center;min-width:0}
.link-field input{flex:1;min-width:0;border:1px solid #e5d9d1;background:#fffefa;padding:10px 9px;border-radius:5px;font-size:9px;color:#7e7168}
.link-status{font-size:8px;letter-spacing:.08em;color:#63775b;background:#eaf0e5;border-radius:20px;padding:5px 8px;white-space:nowrap}
.link-status.draft{background:#f3ebe4;color:#89756a}
.link-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.link-help{font-size:8px;color:#95877e;line-height:1.7;margin-top:10px}
.checklist{display:grid;gap:0}
.checklist-row{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0e8e2}
.checklist-row:last-child{border-bottom:0;padding-bottom:0}
.checkmark{height:23px;width:23px;border:1px solid #d9cbc1;border-radius:50%;display:grid;place-items:center;color:#a8a098;font-size:11px;background:#fffdfa}
.checkmark.done{background:#e9f0e5;border-color:#d6e3d0;color:#5f7956}
.checklist-main{min-width:0}.checklist-main strong{display:block;font-size:10px;font-weight:600}
.checklist-main small{display:block;font-size:8px;color:var(--muted);line-height:1.6;margin-top:3px}
.checklist-row .btn{white-space:nowrap}
@media(max-width:1080px){.dashboard-split{grid-template-columns:1fr}.event-switcher{width:145px;max-width:20vw}}
@media(max-width:740px){.topbar{height:auto;min-height:64px;padding:10px 13px;flex-wrap:wrap;align-items:center}.top-actions{gap:5px;flex-wrap:wrap;justify-content:flex-end}.event-switcher{width:130px;max-width:35vw;padding:8px;font-size:9px}.top-actions .btn{padding:8px 9px}.crumb{font-size:8px}.checklist-row{grid-template-columns:23px minmax(0,1fr)}.checklist-row>.btn{grid-column:2;justify-self:start}.rsvp-item{grid-template-columns:80px minmax(50px,1fr) 30px;gap:7px}.link-field{align-items:stretch}.link-field .btn{padding:8px}}

.phone-screen.custom-blank{background:#fffdf9;color:#3f3842;justify-content:center;padding:25px 17px;border-color:#dfd5e8}
.phone-screen.custom-blank .blank-label{font-size:7px;letter-spacing:.2em;color:#8c71ba;margin-bottom:27px}

/* Guided invitation setup wizard */
body.wizard-mode{background:#f7f4f0}
.setup-wizard{min-height:100vh;background:#f7f4f0;color:#2b2826;font-family:var(--sans)}
.setup-wizard *{box-sizing:border-box}
.setup-wizard .wizard-topbar{height:78px;background:#fffdf9;border-bottom:1px solid #e8ded6;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);gap:18px}
.setup-wizard .wizard-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.setup-wizard .wizard-brand-mark{width:42px;height:42px;border:1px solid #ad7475;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:#ad7475}
.setup-wizard .wizard-brand strong{display:block;font-size:12px;letter-spacing:.13em}
.setup-wizard .wizard-brand small{display:block;margin-top:4px;font-size:8px;letter-spacing:.18em;color:#81776f}
.setup-wizard .wizard-exit{border:1px solid #e4d8ce;background:white;color:#5f5650;border-radius:24px;padding:10px 16px;font-size:11px;font-weight:600}

.setup-wizard .wizard-progress{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px auto 28px;max-width:720px}
.setup-wizard .wizard-progress-step{display:flex;align-items:center;gap:8px;color:#9a9088;font-size:11px;white-space:nowrap}
.setup-wizard .wizard-progress-step .num{width:27px;height:27px;border:1px solid #d9cec5;border-radius:50%;display:grid;place-items:center;background:#fffdf9;font-size:11px}

.setup-wizard .wizard-progress-step.done .num{background:#e8eee5;color:#506a4d;border-color:#c9d6c4}
.setup-wizard .wizard-progress-line{width:clamp(24px,8vw,100px);height:1px;background:#e1d6ce}
.setup-wizard .wizard-content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.75fr);gap:24px;align-items:start}

.setup-wizard .wizard-kicker{font-size:9px;letter-spacing:.16em;color:#ad7475;font-weight:700}
.setup-wizard .wizard-h1{font-family:var(--serif);font-weight:400;font-size:clamp(27px,3.2vw,38px);line-height:1.18;margin:11px 0 10px}
.setup-wizard .wizard-intro{font-size:12px;line-height:1.8;color:#81776f;margin:0 0 24px;max-width:610px}
.setup-wizard .section-pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wizard-photo-panel{margin-top:22px;padding:18px;border:1px solid #e8dfd1;border-radius:16px;background:#fffdf9}.wizard-photo-panel h2{margin:0 0 6px;font-size:18px}.wizard-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.wizard-photo-item{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:12px;border:1px solid #eee5d9;border-radius:12px;background:#fff}.wizard-photo-item img{width:100%;max-height:140px;object-fit:cover;border-radius:8px}.wizard-photo-item input{max-width:100%}
.setup-wizard .section-pick{min-height:100px;border:1px solid #ebe1d9;border-radius:13px;background:#fff;padding:15px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer}

function collectCountdownDesignForm(){
 var e=current();if(!e)return null;var d=e.countdownDesign||{};e.countdownDesign=d;
 function val(id){var el=document.getElementById(id);return el?el.value:'';}
 d.fontFamily=val('countdownFont')||'serif';d.fontColor=val('countdownColor')||'#956b65';d.title=val('countdownTitle').trim()||'Counting down to the day';d.subtitle=val('countdownSubtitle').trim();d.smallLine=d.subtitle;d.layoutStyle=d.layoutStyle||'Cards';d.size=Math.max(30,Math.min(100,Number(val('countdownSize'))||70));
 d.artworkSlots=d.artworkSlots||{};
 ['top-left','top-center','top-right','middle','bottom-left','bottom-center','bottom-right'].forEach(function(pos){var el=document.querySelector('[data-countdown-art-slot="'+pos+'"]');if(!el)return;var v=el.value;if(!v){d.artworkSlots[pos]=null;return;}if(v.indexOf('upload:')===0){var up=(d.artworkUploads||[]).find(function(x){return x.id===v.slice(7);});d.artworkSlots[pos]=up?{id:up.id,name:up.name,data:up.data}:null;}else{var id=v.slice(8),def=familyArtworkDefinitions().find(function(x){return x.id===id;});d.artworkSlots[pos]=def?{id:def.id,name:def.label}:null;}});
 var iv=val('countdownIllustration');if(iv==='upload'){if(!d.illustration||!d.illustration.data)d.illustration=null;}else if(iv.indexOf('library:')===0)d.illustration={id:iv.slice(8)};else d.illustration=null;
 return d;
}
function bindCountdownDesignEvents(){
 var e=current();if(!e)return;
 var initial=JSON.stringify(e.countdownDesign||{});function mark(){var el=document.getElementById('countdownSaveState');if(el)el.textContent='Unsaved changes';updatePreview();}
 function updatePreview(){var title=document.getElementById('countdownTitle'),sub=document.getElementById('countdownSubtitle'),pTitle=document.getElementById('countdownPreviewTitle'),pSub=document.querySelector('.cd-preview-small'),size=document.getElementById('countdownSize'),timer=document.getElementById('countdownPreviewTimer'),colour=document.getElementById('countdownColor');if(pTitle&&title)pTitle.textContent=title.value||'Counting down to the day';if(pSub&&sub)pSub.textContent=sub.value;if(timer&&size)timer.style.transform='scale('+Math.max(30,Math.min(100,Number(size.value)||70))/100+')';if(timer&&colour)timer.style.color=colour.value;}
 document.querySelectorAll('#root input,#root select').forEach(function(el){if(el.id!=='eventSwitcher'&&el.id!=='langToggle'){el.addEventListener('input',mark);el.addEventListener('change',mark);}});
 document.querySelectorAll('[data-countdown-layout]').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('[data-countdown-layout]').forEach(function(x){x.classList.remove('active');});btn.classList.add('active');e.countdownDesign.layoutStyle=btn.dataset.countdownLayout;mark();});});
 var range=document.getElementById('countdownSize');if(range)range.addEventListener('input',function(){var el=document.getElementById('countdownSizeValue');if(el)el.textContent=range.value+'%';updatePreview();});
 document.querySelectorAll('[data-cd-device]').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('[data-cd-device]').forEach(function(x){x.classList.toggle('active',x===btn);});var phone=document.getElementById('countdownPreviewPhone');if(phone)phone.classList.toggle('desktop',btn.dataset.cdDevice==='desktop');});});
 var refresh=document.getElementById('countdownPreviewRefresh');if(refresh)refresh.addEventListener('click',updatePreview);
 var openPreview=document.getElementById('countdownPreviewOpen');if(openPreview)openPreview.addEventListener('click',function(){var d=collectCountdownDesignForm();if(!d)return;d.isConfigured=true;e.countdownDesign=d;var url=makePublicLink(e);window.open(url,'_blank','noopener,noreferrer');});
 var discard=document.getElementById('discardCountdownDesign');if(discard)discard.addEventListener('click',function(){e.countdownDesign=JSON.parse(initial||'{}');save();render();toast('Changes discarded.');});
 function savePage(){var d=collectCountdownDesignForm();if(!d)return;d.isConfigured=true;e.countdownDesign=d;if(e.link){e.link=makePublicLink(e);e.published=true;}save();render();toast('Countdown settings saved on this device.');}
 var saveBtn=document.getElementById('saveCountdownDesign');if(saveBtn)saveBtn.addEventListener('click',savePage);
 var au=document.getElementById('countdownArtworkUpload');if(au)au.addEventListener('change',function(){var file=au.files&&au.files[0];if(!file)return;collectCountdownDesignForm();var reader=new FileReader();reader.onload=function(){var data=String(reader.result||'');if(data.length>85000){toast('Choose a smaller transparent artwork file, under about 85 KB.');return;}e.countdownDesign.artworkUploads=Array.isArray(e.countdownDesign.artworkUploads)?e.countdownDesign.artworkUploads:[];if(e.countdownDesign.artworkUploads.length>=10){toast('Remove an unused upload before adding another.');return;}e.countdownDesign.artworkUploads.push({id:uid(),name:file.name,data:data});save();render();};reader.onerror=function(){toast('Could not read this artwork file.');};reader.readAsDataURL(file);});
 var iu=document.getElementById('countdownIllustrationUpload');if(iu)iu.addEventListener('change',function(){var file=iu.files&&iu.files[0];if(!file)return;collectCountdownDesignForm();var reader=new FileReader();reader.onload=function(){var data=String(reader.result||'');if(data.length>85000){toast('Choose a smaller transparent illustration file, under about 85 KB.');return;}e.countdownDesign.illustration={name:file.name,data:data};save();render();};reader.onerror=function(){toast('Could not read this illustration file.');};reader.readAsDataURL(file);});

function sectionPhotosView(){var e=current();e.sectionPhotos=e.sectionPhotos||{};e.ownSections=Array.isArray(e.ownSections)?e.ownSections:[];while(e.ownSections.length<3)e.ownSections.push({title:'',text:'',photo:null});var items=[{key:'countdown',title:'Countdown photo',desc:'Photo beside the days-to-go card.'},{key:'promise',title:'Our Promise artwork',desc:'Background artwork behind your promise card.'},{key:'schedule',title:'Your schedule photo',desc:'Photo shown with the Order of Events / schedule section.'},{key:'rsvp',title:'RSVP photo',desc:'Photo at the top of the reply card.'}];return head('SECTION PHOTOS','Photos that style your invitation','Choose an uploaded photo or add artwork for each section, including your own custom sections.')+'<div class="notice"><strong>Section photos</strong><p>Upload one image for each built-in section. For your own sections, add a heading, wording and photo. Photos are saved in this browser prototype.</p></div><div class="grid-2">'+items.map(function(it){var p=e.sectionPhotos[it.key];return '<section class="panel"><div class="panel-head"><div><h2>'+it.title+'</h2><p>'+it.desc+'</p></div></div>'+(p&&p.data?'<img src="'+p.data+'" alt="'+it.title+'" style="display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin:12px 0">':'<div class="empty" style="margin:12px 0"><strong>No photo uploaded</strong></div>')+'<p class="muted">'+(p&&p.name?esc(p.name):'0 photos uploaded')+'</p><div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn outline" for="sectionPhoto-'+it.key+'">'+(p&&p.data?'Change photo':'Upload photo')+'<input id="sectionPhoto-'+it.key+'" data-section-photo="'+it.key+'" type="file" accept="image/*" hidden></label>'+(p&&p.data?'<button class="btn danger" data-section-photo-remove="'+it.key+'">Remove</button>':'')+'</div></section>';}).join('')+'</div><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Your own sections</h2><p>The extra sections your templat   var dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;spawnClock+=dt;fireworkClock+=dt;

  var interval=(effect==='Bokeh'||effect==='Stars'||effect==='Aurora'||effect==='Fireflies')?.30:.15;
  while(spawnClock>interval){spawnClock-=interval;spawn();}
  for(var i=particles.length-1;i>=0;i--){
   var p=particles[i];p.age+=dt;
   if(p.kind==='rocket'){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;
    if(p.age>1.25){burst(p.x,p.y);particles.splice(i,1);continue;}
   }else{

    if(p.kind==='shootingStar'){p.x+=p.vx*dt;p.y+=p.vy*dt;}
    if(p.kind==='snow'||p.kind==='petal'||p.kind==='leaf'||p.kind==='marigold'||p.kind==='confetti'||p.kind==='ribbon')p.x+=Math.sin(now*.001+p.phase||p.age)*14*dt;
    if(p.kind==='spark')p.vy+=p.gravity*dt;
    if(p.kind==='balloon'||p.kind==='butterfly'||p.kind==='leaf'||p.kind==='petal'||p.kind==='marigold'||p.kind==='feather'||p.kind==='lantern'||p.kind==='lamp'||p.kind==='note'||p.kind==='heart'||p.kind==='seed')p.rotation+=p.spin*dt;
   }
   if(p.life<100)p.life-=dt;

  }

function familyIllustrationLibrary(e){
 var definitions=familyArtworkDefinitions(),selected=Array.isArray(e.familyArtworks)?e.familyArtworks:[];
 var filters=[['all',tr('All artwork','සියලු සැරසිලි')],['decorative',tr('Decorative','අලංකාර නිර්මාණ')],['ceremonial',tr('Sri Lankan ceremonial','ශ්‍රී ලාංකික චාරිත්‍ර')],['floral',tr('Floral','මල් සැරසිලි')],['custom',tr('My uploads','මගේ නිර්මාණ')]];
 var filterHtml=filters.map(function(x,i){return '<button type="button" class="family-art-filter '+(i===0?'active':'')+'" data-family-art-filter="'+x[0]+'">'+x[1]+'</button>';}).join('');
 var cards=definitions.map(function(a){var chosen=selected.some(function(x){return x.id===a.id;});return '<button type="button" class="family-art-option '+(chosen?'selected':'')+'" data-family-art-select="'+a.id+'" data-art-category="'+a.category+'" aria-pressed="'+(chosen?'true':'false')+'">'+familyArtworkSvg(a.id)+'<strong>'+esc(tr(a.label,a.si))+'</strong><small>'+esc(a.sub)+'</small><span class="family-art-check '+(chosen?'':'family-art-empty-check')+'">'+(chosen?'✓':'+')+'</span></button>';}).join('');var customCards=selected.filter(function(a){return !!a.data;}).map(function(a){return '<button type="button" class="family-art-option selected" data-family-art-select="'+esc(a.id)+'" data-art-category="custom" aria-pressed="true"><img src="'+esc(a.data)+'" alt="'+esc(a.name||'Custom artwork')+'"><strong>'+esc(a.name||'Custom artwork')+'</strong><small>'+tr('Uploaded artwork','එක් කළ නිර්මාණය')+'</small><span class="family-art-check">✓</span></button>';}).join('');cards+=customCards;
 var selectedHtml=selected.map(function(a){var art=definitions.find(function(x){return x.id===a.id;});var thumb=a.data?'<img src="'+esc(a.data)+'" alt="'+esc(a.name||'Uploaded artwork')+'">':familyArtworkSvg(a.id);var positions=[['top-left','Top left'],['top-center','Top centre'],['top-right','Top right'],['middle','Middle'],['bottom-left','Bottom left'],['bottom-center','Bottom centre'],['bottom-right','Bottom right']];return '<article class="family-art-selected-item"><div class="family-art-selected-thumb">'+thumb+'</div><div class="family-art-selected-controls"><div style="grid-column:1/-1;font-size:9px;color:#8c766d">'+(art&&art.source?('Source: '+esc(art.source)+(art.credit?' · '+esc(art.credit):'')):'Original MAGIC CREATIONS artwork')+(art&&art.sourceUrl?' · <a href="'+esc(art.sourceUrl)+'" target="_blank" rel="noopener" style="text-decoration:underline">View source</a>':'')+'</div><label>Position<select data-family-art-position="'+esc(a.id)+'">'+positions.map(function(p){return '<option value="'+p[0]+'" '+((a.position||'bottom-center')===p[0]?'selected':'')+'>'+p[1]+'</option>';}).join('')+'</select></label><label>Size <span>'+Number(a.size||36)+'%</span><input type="range" min="12" max="90" value="'+Number(a.size||36)+'" data-family-art-size="'+esc(a.id)+'"></label><label>Opacity <span>'+Number(a.opacity==null?100:a.opacity)+'%</span><input type="range" min="15" max="100" value="'+Number(a.opacity==null?100:a.opacity)+'" data-family-art-opacity="'+esc(a.id)+'"></label><label><span><input type="checkbox" data-family-art-flip="'+esc(a.id)+'" '+(a.flip?'checked':'')+'> Flip artwork</span></label><label><span><input type="checkbox" data-family-art-front="'+esc(a.id)+'" '+(a.front?'checked':'')+'> In front of content</span></label><button type="button" class="family-art-remove" data-family-art-remove="'+esc(a.id)+'">Remove illustration</button></div></article>';}).join('');
 return '<section class="family-art-library"><div class="family-art-library-head"><div><h2>'+tr('Choose decorative artwork','අලංකාර සැරසිල්ලක් තෝරන්න')+'</h2><p>'+tr('Elegant wedding artwork, ornamental corners, floral overlays and Sri Lankan ceremonial decorations.','මංගල උත්සව සඳහා අලංකාර සැරසිලි, මල් වැල්, කෙළවරේ නිර්මාණ සහ ශ්‍රී ලාංකික චාරිත්‍රානුකූල සැරසිලි.')+'</p></div><span class="family-art-count">'+selected.length+' selected</span></div><div class="family-art-filters">'+filterHtml+'</div><div class="family-art-grid">'+cards+'</div><div class="family-art-upload-row"><label class="wizard-btn" for="familyArtworkUpload">＋ '+tr('Upload custom artwork','ඔබේම නිර්මාණයක් එක් කරන්න')+'</label><input class="family-art-upload-input" id="familyArtworkUpload" type="file" accept="image/png,image/jpeg,image/webp"></div><p class="family-art-note">'+tr('Choose original artwork or assets marked CC0. Check each source record before commercial use; source credits are retained below.','Original හෝ CC0 ලෙස සලකුණු කළ සැරසිලි තෝරන්න. ව්‍යාපාරික භාවිතයට පෙර එක් එක් source record පරීක්ෂා කරන්න; credits සුරකියි.')+'</p><div class="family-art-selected-list">'+selectedHtml+'</div><label class="family-art-switch"><input type="checkbox" id="familyArtworkDesktop" '+(e.familyArtworkShowDesktop!==false?'checked':'')+'> '+tr('Show artwork on large screens','විශාල තිරවල artwork පෙන්වන්න')+'</label></section>';
}

function wizardFamiliesView(){
 var e=current();if(!e)return '<div class="panel">No invitation found.</div>';
 function familyCard(side,title,person,parents,show,line,photo){var src=photo&&photo.data?photo.data:'';return '<section class="family-edit-card"><div class="wizard-kicker">'+title+'</div><h2 class="family-preview-names">'+esc(person||'Your names')+'</h2><div class="family-parent-preview">'+esc(parents||'Parents names')+'</div><div class="wizard-field full"><label for="'+side+'FamilyName">Name</label><input id="'+side+'FamilyName" maxlength="100" value="'+esc(person||'')+'" placeholder="'+(side==='groom'?'Groom name':'Bride name')+'"></div><div class="wizard-field full"><label for="'+side+'FamilyParents">Parents</label><input id="'+side+'FamilyParents" maxlength="160" value="'+esc(parents||'')+'" placeholder="Mr & Mrs ..."></div><label class="family-check"><input type="checkbox" id="'+side+'FamilyShowLine" '+(show!==false?'checked':'')+'> Show relationship line</label><div class="wizard-field full"><label for="'+side+'FamilyRelationship">Relationship label</label><input id="'+side+'FamilyRelationship" maxlength="80" value="'+esc(line||'')+'" placeholder="Parents of the groom"></div><div class="wizard-field full"><label>Photo (optional)</label><div class="family-photo-preview" id="'+side+'FamilyPhotoPreview">'+(src?'<img src="'+esc(src)+'" alt="Family photo preview">':'<span>No photo yet</span>')+'</div><label class="wizard-btn" for="'+side+'FamilyPhotoFile">＋ Add photo</label><input type="file" id="'+side+'FamilyPhotoFile" accept="image/*" hidden>'+(src?'<button type="button" class="wizard-btn" id="'+side+'FamilyRemovePhoto">Remove photo</button>':'')+'<small class="field-note">Image is resized to fit the template. Use a small photo for a shareable link.</small></div></section>';}
 var gf=e.groomFamily||{},bf=e.brideFamily||{};
 var body='<div class="wizard-content-grid"><main class="wizard-main"><div class="wizard-kicker">STEP 5 OF 12 · FAMILIES</div><h1 class="wizard-h1">Your families</h1><p class="wizard-intro">Introduce the parents alongside your names. Add both family details and choose premium Sri Lankan illustrations for the invitation.</p><form id="wizardFamiliesForm"><div class="family-edit-grid">'+familyCard('groom','GROOM’S FAMILY',e.groomName||String(e.names||'').split('&')[0].trim(),gf.parents,gf.showRelationship,gf.relationshipLabel,gf.photo)+familyCard('bride','BRIDE’S FAMILY',e.brideName||String(e.names||'').split('&')[1]?.trim(),bf.parents,bf.showRelationship,bf.relationshipLabel,bf.photo)+'</div>'+familyIllustrationLibrary(e)+'<div class="wizard-actions"><button class="wizard-btn" id="wizardBackFamilies" type="button">← Back to hero image</button><button class="wizard-btn primary" type="submit">Save families & continue to Story →</button></div></form></main><aside class="wizard-aside"><div class="wizard-kicker">GUEST INVITATION</div><h2 class="family-aside-title">A celebration of two families</h2><p class="wizard-muted">Family details appear on the guest invitation only when the Families section is enabled. Photos are optional.</p><div class="family-mini-preview"><div>GROOM’S FAMILY<br><strong>'+esc(gf.parents||'Parents’ names')+'</strong></div><div>BRIDE’S FAMILY<br><strong>'+esc(bf.parents||'Parents’ names')+'</strong></div></div></aside></div>';
 return wizardShell(5,body);

function compressInvitationImage(file,maxDimension,maxChars,callback){
 var reader=new FileReader();
 reader.onerror=function(){callback(new Error('Could not read this image.'));};
 reader.onload=function(){
  var img=new Image();
  img.onerror=function(){callback(new Error('Could not process this image.'));};
  img.onload=function(){
   var scale=Math.min(1,maxDimension/Math.max(img.width,img.height)),qualities=[0.72,0.60,0.50,0.40,0.32],qualityIndex=0;
   function encode(){
    var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    var ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    var data=canvas.toDataURL('image/jpeg',qualities[qualityIndex]);
    if(data.length<=maxChars){callback(null,data);return;}
    if(qualityIndex<qualities.length-1){qualityIndex++;encode();return;}
    if(scale>0.34){scale*=0.78;qualityIndex=0;encode();return;}
    callback(new Error('This image is too large after compression. Please choose a smaller image.'));
   }
   encode();
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function saveEventForm(){var e=current(),names=document.getElementById('evTitle').value.trim();if(!names)return;e.title=names;e.names=names;e.type=document.getElementById('evType').value;e.date=document.getElementById('evDate').value;e.time=document.getElementById('evTime').value;e.venue=document.getElementById('evVenue').value.trim();e.totalAttendees=Math.max(0,Number(document.getElementById('evAttendees').value)||0);e.message=document.getElementById('evMessage').value.trim();e.hostPhone=document.getElementById('evPhone').value.trim().replace(/\D/g,'');if(e.link)e.link=makePublicLink(e);save();render();toast('Event details saved in this browser.');}
function normalizePhone(v){var p=String(v||'').replace(/\D/g,'');if(p.indexOf('00')===0)p=p.slice(2);if(p.indexOf('0')===0)p='94'+p.slice(1);else if(p.length===9&&p.indexOf('94')!==0)p='94'+p;return p;}

function openGuestMessage(id){var e=current(),g=e.guests.find(function(x){return x.id===id;});if(!g)return;if(!e.published||!e.link){toast('Publish the invitation before creating guest messages.');return;}var link=makePublicLink(e,g),msg=guestInvitationMessage(e,g,link);g.personalInviteLink=link;save();openModal(modalHead('Personal WhatsApp message','A message customized for '+esc(g.name)+'.')+'<div class="field full"><label>Invitation message</label><textarea class="textarea" id="guestPersonalMessage" rows="9">'+esc(msg)+'</textarea></div><div class="form-actions"><button class="btn outline" type="button" id="copyGuestMessage">Copy message</button><button class="btn primary" type="button" id="sendGuestMessage" '+(!g.phone?'disabled title="Add a WhatsApp number to this guest first"':'')+'>Send via WhatsApp</button></div>');var cp=document.getElementById('copyGuestMessage');if(cp)cp.addEventListener('click',function(){copyText(document.getElementById('guestPersonalMessage').value,'Invitation message copied.');});var send=document.getElementById('sendGuestMessage');if(send)send.addEventListener('click',function(){var phone=normalizePhone(g.phone);if(!phone){toast('Add a phone number to this guest first.');return;}var message=document.getElementById('guestPersonalMessage').value;var waUrl='https://wa.me/'+phone+'?text='+encodeURIComponent(message);var waTab=window.open(waUrl,'_blank');if(!waTab){var fallback=document.createElement('a');fallback.href=waUrl;fallback.target='_blank';fallback.rel='noopener';document.body.appendChild(fallback);fallback.click();fallback.remove();}g.inviteSentAt=new Date().toISOString();save();});}

function parseCsvRows(text){var rows=[],row=[],cell='',quoted=false;text=String(text||'').replace(/^\uFEFF/,'');for(var i=0;i<text.length;i++){var ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}else if(ch==='"'){quoted=!quoted;}else if(ch===','&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row);row=[];cell='';}else cell+=ch;}if(cell!==''||row.length){row.push(cell);if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row);}return rows;}

throw new Error('No valid guest names found in the CSV.');save();searchText='';filterStatus='all';render();toast(imported+' guests imported'+(skipped?' · '+skipped+' rows skipped':'')+'.');}catch(err){toast(err.message||'Could not import this CSV file.');}};reader.onerror=function(){toast('Could not read the CSV file.');};reader.readAsText(file);ev.target.value='';}
function exportGuests(){var e=current(),csv=[['Name','Phone','Group','People Invited','RSVP Status','Table'].join(',')].concat(e.guests.map(function(g){return [g.name,g.phone,g.group,g.count,g.status,(e.tables.find(function(t){return t.id===g.table;})||{}).name||''].map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');})).join('\r\n');var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='magic-creations-guests.csv';a.click();URL.revokeObjectURL(url);}
