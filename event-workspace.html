/* Eventoura-inspired dashboard layout with original MAGIC CREATIONS styling */
.event-switcher{width:165px;max-width:22vw;padding:9px 10px;background:#faf5f0;border-color:#e5d9d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dashboard-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:16px;align-items:start}

.link-box{border:1px solid #e8d9d0;background:linear-gradient(130deg,#fbf5ef,#fffdfa);padding:17px;border-radius:7px}
.link-box-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}

.link-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}

.checklist{display:grid;gap:0}

.checklist-row:last-child{border-bottom:0;padding-bottom:0}

.checklist-main{min-width:0}.checklist-main strong{display:block;font-size:10px;font-weight:600}

.checklist-row .btn{white-space:nowrap}

function guestTable(rows,compact){

var share=compact?'':'<button class="btn outline small" data-share-guest="'+esc(g.id)+'" '+(!g.phone?'disabled title="Add a phone number before sharing"':'title="Send invitation on WhatsApp"')+'>'+tr('Invite','ආරාධනා')+'</button>';

function importGuestsCsv(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;if(file.size>1024*1024){toast(tr('Please choose a CSV file under 1 MB.','1 MB ට අඩු CSV ගොනුවක් තෝරන්න.'));ev.target.value='';return;}var reader=new FileReader();reader.onload=function(){try{var rows=parseCsvRows(reader.result||'');if(rows.length<2)throw new Error('The CSV has no guest rows.');var headers=rows[0].map(function(h){return String(h||'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');});function col(names){for(var i=0;i<headers.length;i++){if(names.indexOf(headers[i])>=0)return i;}return -1;}var ix={name:col(['name','guest','guest name','full name']),phone:col(['phone','telephone','mobile','whatsapp','phone number']),group:col(['group','side','party','category','relation']),count:col(['count','people invited','guests','party size','number invited']),status:col(['rsvp status','status','rsvp']),table:col(['table','table name','seating'])};if(ix.name<0)throw new Error('Please include a Name or Guest Name column.');var e=current(),imported=0,skipped=0,allowed=['pending','accepted','declined','maybe'];rows.slice(1).forEach(function(row){var name=String(row[ix.name]||'').trim();if(!name){skipped++;return;}var raw=ix.status>=0?String(row[ix.status]||'pending').trim().toLowerCase():'pending';var status=({'yes':'accepted','coming':'accepted','confirmed':'accepted','no':'declined','not coming':'declined','undecided':'maybe'})[raw]||raw;if(allowed.indexOf(status)<0)status='pending';var tableName=ix.table>=0?String(row[ix.table]||'').trim():'';var table=e.tables.find(function(t){return t.name.toLowerCase()===tableName.toLowerCase();});e.guests.push({id:uid(),name:name,phone:ix.phone>=0?String(row[ix.phone]||'').trim():'',group:ix.group>=0?String(row[ix.group]||'Other').trim()||'Other':'Other',count:Math.max(1,Math.min(20,Number(ix.count>=0?row[ix.count]:1)||1)),status:status,table:table?table.id:''});imported++;});if(!imported)throw new Error('No valid guest nam
