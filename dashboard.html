function guestTable(rows,compact){if(!rows.length)return '<div class="empty"><strong>No guests yet</strong><p>Add a guest to begin your guest list.</p></div>';return '<div class="table-wrap"><table><thead><tr><th>GUEST</th><th>GROUP</th><th>INVITED</th><th>RSVP STATUS</th>'+(compact?'':'<th>TABLE</th><th>ACTIONS</th>')+'</tr></thead><tbody>'+rows.map(function(g){return '<tr><td><div class="person"><span class="avatar">'+esc(initials(g.name))+'</span><span><b>'+esc(g.name)+'</b><small>'+esc(g.phone||'No phone added')+'</small></span></div></td><td>'+esc(g.group||'Other')+'</td><td>'+Number(g.count||1)+'</td><td>'+(compact?badge(g.status):'<select class="select" style="min-width:100px;padding:7px" data-status="'+g.id+'">'+['pending','accepted','declined','maybe'].map(function(s){return '<option value="'+s+'" '+(g.status===s?'selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>';}).join('')+'</select>')+'</td>'+(compact?'':'<td><select class="select" style="min-width:100px;padding:7px" data-guest-table="'+g.id+'"><option value="">Unassigned</option>'+current().tables.map(function(t){return '<option value="'+t.id+'" '+(g.table===t.id?'selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</select></td><td><button class="btn danger small" data-delete-guest="'+g.id+'">Remove</button></td>')+'</tr>';}).join('')+'</tbody></table></div>';}

return head(tr('GUEST MANAGEMENT','අමුත්තන් කළමනාකරණය'),tr('Know who is coming.','කවුද එන්නේ කියලා දැනගන්න.'),tr('Manage guest entries and example RSVP statuses. Changes are saved on this browser.','අමුත්තන් සහ RSVP statuses කළමනාකරණය කරන්න. වෙනස්කම් මෙම browser එකේ save වේ.'),'<button class="btn outline" id="exportGuests">Export CSV</button><button class="btn primary" id="addGuest">+ Add guest</button>')+

function makePublicLink(e){var data={names:e.names,date:e.date,time:e.time,venue:e.venue,message:e.message,story:e.story,template:e.template,type:e.type,hostPhone:e.hostPhone};var code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));return location.origin+location.pathname+'#invite='+encodeURIComponent(code);}

function closeModal(){document.getElementById('modalBack').classList.remove('open');document.getElementById('modalContent').innerHTML='';}
function modalHead(title,desc){return '<div class="modal-top"><div><h2>'+title+'</h2><p>'+desc+'</p></div><button class="close" data-modal-close>×</button></div>';}
function guestModal(){openModal(modalHead('Add a guest','Enter the details to add them to your local guest list.')+'<form id="guestForm"><div class="form-grid"><div class="field full"><label>Guest name *</label><input class="input" name="name" required maxlength="100"></div><div class="field"><label>WhatsApp / phone</label><input class="input" name="phone" maxlength="30"></div><div class="field"><label>Group</label><select class="select" name="group"><option>Family</option><option>Friends</option><option>Work</option><option>Other</option><option>Bride side</option><option>Groom side</option></select></div><div class="field"><label>People invited</label><input class="input" name="count" type="number" min="1" max="20" value="1"></div><div class="field"><label>RSVP status</label><select class="select" name="status"><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="declined">Declined</option><option value="maybe">Maybe</option></select></div></div><div class="form-actions"><button class="btn primary" type="submit">Save guest</button></div></form>');document.getElementById('guestForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target);current().guests.push({id:uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),group:f.get('group'),count:Math.max(1,Number(f.get('count')||1)),status:f.get('status'),table:''});save();closeModal();render();toast('Guest added to this browser.');});}
function agendaModal(){openModal(modalHead('Add agenda item','Add one item to your event timeline.')+'<form id="agendaForm"><div class="form-grid"><div class="field"><label>Time *</label><input class="input" type="time" name="time" required value="10:00"></div><div class="field"><label>Title *</label><input class="input" name="title" required maxlength="100" placeholder="Ceremony"></div><div class="field full"><label>Description / location</label><textarea class="textarea" rows="2" name="description"></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">Add agenda item</button></div></form>');document.getElementById('agendaForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target);current().agenda.push({id:uid(),time:f.get('time'),title:f.get('title').trim(),description:f.get('description').trim()});save();closeModal();render();toast('Agenda item added.');});}
function wishModal(){openModal(modalHead('Add a guest-book wish','Add a sample wish and choose whether to approve it.')+'<form id="wishForm"><div class="form-grid"><div class="field full"><label>Name *</label><input class="input" name="name" required maxlength="80"></div><div class="field full"><label>Message *</label><textarea class="textarea" rows="3" name="message" required maxlength="600"></textarea></div><div class="field full"><label><input type="checkbox" name="approved" checked> Approved for display</label></div></div><div class="form-actions"><button class="btn primary" type="submit">Save wish</button></div></form>');document.getElementById('wishForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target);current().wishes.unshift({id:uid(),name:f.get('name').trim(),message:f.get('message').trim(),approved:f.get('approved')==='on'});save();closeModal();render();toast('Wish added.');});}
function tableModal(){openModal(modalHead('Add a table','Name the table and set its seating capacity.')+'<form id="tableForm"><div class="form-grid"><div class="field"><label>Table name *</label><input class="input" name="name" required maxlength="50" placeholder="Table 04"></div><div class="field"><label>Capacity *</label><input class="input" name="capacity" type="number" min="1" max="50" required value="8"></div></div><div class="form-actions"><button class="btn primary" type="submit">Add table</button></div></form>');document.getElementById('tableForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target);current().tables.push({id:uid(),name:f.get('name').trim(),capacity:Math.max(1,Number(f.get('capacity')||8))});save();closeModal();render();toast('Table added.');});}
function expenseModal(){openModal(modalHead('Add expense','Record a planned cost for your event.')+'<form id="expenseForm"><div class="form-grid"><div class="field full"><label>Expense category *</label><input class="input" name="category" required maxlength="80" placeholder="Decorations"></div><div class="field"><label>Planned amount (LKR)</label><input class="input" name="planned" type="number" min="0" value="0"></div><div class="field"><label>Actual amount (LKR)</label><input class="input" name="actual" type="number" min="0" value="0"></div></div><div class="form-actions"><button class="btn primary" type="submit">Add expense</button></div></form>');document.getElementById('expenseForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target);current().expenses.push({id:uid(),category:f.get('category').trim(),planned:Math.max(0,Number(f.get('planned')||0)),actual:Math.max(0,Number(f.get('actual')||0))});save();closeModal();render();toast('Expense added.');});}
function newEventModal(){openModal(modalHead('Create a new event','This creates a separate event workspace in this browser.')+'<form id="newEventForm"><div class="form-grid"><div class="field full"><label>Event / couple names *</label><input class="input" name="title" required maxlength="100" placeholder="Shan & Shashika"></div><div class="field"><label>Event type</label><select class="select" name="type"><option>Wedding</option><option>Engagement</option><option>Birthday</option><option>Anniversary</option><option>Other</option></select></div><div class="field"><label>Date</label><input class="input" name="date" type="date"></div><div class="field"><label>Time</label><input class="input" name="time" type="time" value="09:00"></div><div class="field"><label>Venue</label><input class="input" name="venue" placeholder="Colombo, Sri Lanka"></div></div><div class="form-actions"><button class="btn primary" type="submit">Create event</button></div></form>');document.getElementById('newEventForm').addEventListener('submit',function(ev){ev.preventDefault();var f=new FormData(ev.target),name=f.get('title').trim(),type=f.get('type');var e={id:uid(),title:name,names:name,type:type,date:f.get('date'),time:f.get('time'),venue:f.get('venue').trim(),hostPhone:'',template:'ever-after',message:'Together with our families, we invite you to celebrate our special day.',story:'',budget:0,published:false,sections:{countdown:true,story:true,agenda:true,gallery:true,map:true,rsvp:true},guests:[],agenda:[],gallery:[],wishes:[],tables:[],expenses:[],link:''};state.events.push(e);state.active=e.id;save();closeModal();go('overview');toast('New event created locally.');});}
function saveEventForm(){var e=current(),names=document.getElementById('evTitle').value.trim();if(!names)return;e.title=names;e.names=names;e.type=document.getElementById('evType').value;e.date=document.getElementById('evDate').value;e.time=document.getElementById('evTime').value;e.venue=document.getElementById('evVenue').value.trim();e.message=document.getElementById('evMessage').value.trim();e.hostPhone=document.getElementById('evPhone').value.trim().replace(/\D/g,'');if(e.link)e.link=makePublicLink(e);save();render();toast('Event details saved in this browser.');}
function exportGuests(){var e=current(),csv=[['Name','Phone','Group','People Invited','RSVP Status','Table'].join(',')].concat(e.guests.map(function(g){return [g.name,g.phone,g.group,g.count,g.status,(e.tables.find(function(t){return t.id===g.table;})||{}).name||''].map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');})).join('\r\n');var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='magic-creations-guests.csv';a.click();URL.revokeObjectURL(url);}
function uploadImage(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;if(file.size>500*1024){toast('Please choose an image smaller than 500 KB for this local demo.');ev.target.value='';return;}var reader=new FileReader();reader.onload=function(){current().gallery.push({id:uid(),name:file.name,data:reader.result});var ok=save();if(ok){render();toast('Image added to local gallery.');}};reader.onerror=function(){toast('Could not read this image.');};reader.readAsDataURL(file);}
function openTemplateModal(id){var t=tpl(id),e=current();openModal(modalHead(t.name,t.subtitle+' · '+t.category)+'<div style="max-width:330px;margin:0 auto 16px">'+templateArtwork(t,e)+'</div><p style="font-size:10px;color:var(--muted);line-height:1.7">'+tr('Select this design to customize your event information. These are original design concepts.','ඔබේ event විස්තර සමඟ සකස් කිරීමට මෙම සැලසුම තෝරන්න. මේවා original design concepts.')+'</p><div class="form-actions"><button class="btn primary" id="useTemplateNow">Use this design</button></div>');document.getElementById('useTemplateNow').addEventListener('click',function(){current().template=id;save();closeModal();go('editor');});}
window.addEventListener('hashchange',function(){if(location.hash.indexOf('#invite=')===0){render();return;}var m=location.hash.match(/#app=([a-z]+)/);if(m)view=m[1];render();});
if(location.hash.indexOf('#invite=')===0){render();}else{var match=location.hash.match(/#app=([a-z]+)/);if(match)view=match[1];render();}
})();
</script>
</body>
